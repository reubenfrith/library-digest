<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Digest</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --accent: #6c8ef5;
    --accent-dim: #3d4f8a;
    --text: #e2e4ed;
    --text-dim: #7a7f9a;
    --danger: #e05c6a;
    --success: #4caf7d;
    --radius: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  header .controls { display: flex; gap: 10px; align-items: center; }

  /* ── Controls bar ───────────────────────────────────── */
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  /* ── Main layout ────────────────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 101px);
  }
  .pane {
    overflow-y: auto;
    padding: 20px;
  }
  .pane + .pane { border-left: 1px solid var(--border); }
  .pane-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  /* ── Shared controls ────────────────────────────────── */
  select, input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  select:focus, input[type="text"]:focus { border-color: var(--accent); }
  select { cursor: pointer; }

  button {
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
  }
  .btn-danger { background: transparent; border: none; color: var(--danger); padding: 4px 8px; font-size: 12px; }

  /* ── Source card ────────────────────────────────────── */
  .source-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .source-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .source-title { font-weight: 500; font-size: 13px; word-break: break-all; }
  .source-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  /* ── Add-source form ────────────────────────────────── */
  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-top: 16px;
  }
  .add-form input { width: 100%; margin-bottom: 8px; }
  .add-form .row { display: flex; gap: 8px; }
  .add-form .row input { flex: 1; }
  .add-form .row button { white-space: nowrap; }
  .add-status { font-size: 12px; margin-top: 8px; min-height: 18px; }
  .add-status.error { color: var(--danger); }
  .add-status.ok { color: var(--success); }

  /* ── Search pane ────────────────────────────────────── */
  .search-input-wrap { position: relative; margin-bottom: 18px; }
  .search-input-wrap input { width: 100%; padding-left: 34px; }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 14px;
    pointer-events: none;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .result-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .result-title { font-weight: 500; font-size: 13px; }
  .result-badge {
    font-size: 11px;
    border-radius: 4px;
    padding: 2px 7px;
    background: var(--accent-dim);
    color: var(--text);
  }
  .result-loc { font-size: 12px; color: var(--text-dim); }
  .result-loc a { color: var(--accent); text-decoration: none; }
  .result-loc a:hover { text-decoration: underline; }
  .result-chapter { font-size: 12px; color: var(--text-dim); font-style: italic; margin-bottom: 6px; }
  .result-text { font-size: 13px; color: var(--text); line-height: 1.6; }
  .result-score {
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    margin-top: 6px;
  }

  /* ── New library inline form ────────────────────────── */
  .new-library-form {
    display: none;
    gap: 6px;
    align-items: center;
  }
  .new-library-form.open { display: flex; }
  .new-library-form input { min-width: 160px; }

  /* ── Empty / loading states ─────────────────────────── */
  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; text-align: center; }
  .spinner { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Header -->
<header>
  <h1>Library Digest</h1>
  <div class="controls">
    <div class="new-library-form" id="newLibraryForm">
      <input type="text" id="newLibraryName" placeholder="Library name…" />
      <button class="btn-primary" onclick="submitNewLibrary()">Create</button>
      <button class="btn-ghost" onclick="toggleNewLibrary(false)">Cancel</button>
    </div>
    <button class="btn-primary" id="newLibraryBtn" onclick="toggleNewLibrary(true)">+ New Library</button>
  </div>
</header>

<!-- Toolbar -->
<div class="toolbar">
  <select id="librarySelect" onchange="onLibraryChange()">
    <option value="">Loading…</option>
  </select>
  <select id="moduleSelect" onchange="onModuleChange()">
    <option value="">All modules</option>
  </select>
</div>

<!-- Main layout -->
<div class="layout">

  <!-- Left: Sources -->
  <div class="pane" id="sourcesPane">
    <div class="pane-title">Sources</div>
    <div id="sourceList"><div class="empty">Select a library above.</div></div>

    <div class="add-form">
      <input type="text" id="addUrl" placeholder="URL or absolute file path…" />
      <div class="row">
        <input type="text" id="addModule" placeholder="Module (e.g. week-1)" />
        <button class="btn-primary" id="addBtn" onclick="submitAdd()">+ Add Source</button>
      </div>
      <div class="add-status" id="addStatus"></div>
    </div>
  </div>

  <!-- Right: Search -->
  <div class="pane" id="searchPane">
    <div class="pane-title">Search</div>
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search your library…" oninput="onSearchInput()" />
    </div>
    <div id="searchResults"><div class="empty">Type to search.</div></div>
  </div>

</div>

<script>
const API = (typeof window !== 'undefined' && window.location.protocol !== 'file:')
  ? ''
  : 'http://localhost:8000';

// ── State ──────────────────────────────────────────────────────────────
let allSources = [];
let allLibraries = [];
let searchTimer = null;
let currentModule = '';

// ── Init ───────────────────────────────────────────────────────────────
async function init() {
  try {
    const libraries = await apiFetch('/libraries');
    allLibraries = libraries;
    const sel = document.getElementById('librarySelect');
    sel.innerHTML = libraries.length
      ? libraries.map(c => `<option value="${c.name}">${c.display_name} (${c.total_chunks.toLocaleString()} chunks)</option>`).join('')
      : '<option value="">No libraries yet</option>';
    if (libraries.length) onLibraryChange();
  } catch (e) {
    document.getElementById('sourceList').innerHTML = `<div class="empty">Could not reach API: ${e.message}</div>`;
  }
}

// ── Library / module change ────────────────────────────────────────────
async function onLibraryChange() {
  const library = currentLibrary();
  if (!library) return;
  currentModule = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '<div class="empty">Type to search.</div>';

  const [sources, modules] = await Promise.all([
    apiFetch(`/libraries/${library}/sources`),
    apiFetch(`/libraries/${library}/modules`),
  ]);
  allSources = sources;
  renderSources();
  renderModuleFilter(modules);
}

function onModuleChange() {
  currentModule = document.getElementById('moduleSelect').value;
  renderSources();
  const q = document.getElementById('searchInput').value.trim();
  if (q) runSearch(q);
}

function renderModuleFilter(modules) {
  const sel = document.getElementById('moduleSelect');
  sel.innerHTML = '<option value="">All modules</option>' +
    modules.map(m => `<option value="${m}">${m}</option>`).join('');
}

// ── Sources ────────────────────────────────────────────────────────────
function renderSources() {
  const filtered = currentModule
    ? allSources.filter(s => s.module === currentModule)
    : allSources;

  if (!filtered.length) {
    document.getElementById('sourceList').innerHTML = '<div class="empty">No sources yet.</div>';
    return;
  }

  const icons = { pdf: '📄', epub: '📄', web: '🌐', video: '🎬', text: '📝' };
  document.getElementById('sourceList').innerHTML = filtered.map(s => `
    <div class="source-card" id="src-${CSS.escape(s.source_ref)}">
      <div class="source-card-top">
        <div>
          <div class="source-title">${icons[s.source_type] || '📎'} ${esc(s.source_title)}</div>
          <div class="source-meta">${s.module ? `${esc(s.module)} · ` : ''}${s.chunk_count.toLocaleString()} chunks</div>
          <div class="source-meta" style="word-break:break-all;margin-top:2px;font-size:11px">${esc(s.source_ref)}</div>
        </div>
        <button class="btn-danger" onclick="deleteSource(${JSON.stringify(s.source_ref)})">delete</button>
      </div>
    </div>
  `).join('');
}

async function deleteSource(sourceRef) {
  if (!confirm(`Delete "${sourceRef}"?\nThis removes all its chunks from the index.`)) return;
  const library = currentLibrary();
  await apiFetch(`/libraries/${library}/sources`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source_ref: sourceRef }),
  });
  allSources = allSources.filter(s => s.source_ref !== sourceRef);
  renderSources();
}

// ── Add source ─────────────────────────────────────────────────────────
async function submitAdd() {
  const url = document.getElementById('addUrl').value.trim();
  const module = document.getElementById('addModule').value.trim();
  const library = currentLibrary();
  const status = document.getElementById('addStatus');
  const btn = document.getElementById('addBtn');

  if (!url || !library) { setStatus('Enter a URL or file path.', 'error'); return; }

  btn.disabled = true;
  btn.textContent = '⏳ Indexing…';
  setStatus('', '');

  try {
    const res = await apiFetch('/ingest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path_or_url: url, library, module }),
    });
    setStatus(`✓ "${res.source_title}" — ${res.chunks_added} chunks added.`, 'ok');
    document.getElementById('addUrl').value = '';
    const sources = await apiFetch(`/libraries/${library}/sources`);
    allSources = sources;
    renderSources();
  } catch (e) {
    setStatus(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '+ Add Source';
  }
}

function setStatus(msg, type) {
  const el = document.getElementById('addStatus');
  el.textContent = msg;
  el.className = 'add-status' + (type ? ` ${type}` : '');
}

// ── Search ─────────────────────────────────────────────────────────────
function onSearchInput() {
  clearTimeout(searchTimer);
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { document.getElementById('searchResults').innerHTML = '<div class="empty">Type to search.</div>'; return; }
  searchTimer = setTimeout(() => runSearch(q), 300);
}

async function runSearch(query) {
  const library = currentLibrary();
  if (!library) return;

  document.getElementById('searchResults').innerHTML = '<div class="empty"><span class="spinner">⏳</span> Searching…</div>';

  const body = { query, library, top_k: 8 };
  if (currentModule) body.module = currentModule;

  const data = await apiFetch('/search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });

  const icons = { pdf: '📄', epub: '📄', web: '🌐', video: '🎬', text: '📝' };

  if (!data.results.length) {
    document.getElementById('searchResults').innerHTML = '<div class="empty">No results found.</div>';
    return;
  }

  document.getElementById('searchResults').innerHTML = data.results.map(r => {
    const icon = icons[r.source_type] || '📎';
    const loc = locationLabel(r);
    const preview = esc(r.text.slice(0, 200)) + (r.text.length > 200 ? '…' : '');
    return `
      <div class="result-card">
        <div class="result-header">
          <span class="result-title">${icon} ${esc(r.source_title)}</span>
          ${r.module ? `<span class="result-badge">${esc(r.module)}</span>` : ''}
          <span class="result-loc">${loc}</span>
        </div>
        ${r.chapter ? `<div class="result-chapter">${esc(r.chapter)}</div>` : ''}
        <div class="result-text">${preview}</div>
        <div class="result-score">score ${(r.score * 100).toFixed(0)}%</div>
      </div>
    `;
  }).join('');
}

function locationLabel(r) {
  if (r.source_type === 'video' && r.timestamp_seconds) {
    const m = String(Math.floor(r.timestamp_seconds / 60)).padStart(2, '0');
    const s = String(r.timestamp_seconds % 60).padStart(2, '0');
    const href = `${r.source_ref}&t=${r.timestamp_seconds}`;
    return `<a href="${href}" target="_blank">${m}:${s}</a>`;
  }
  if (r.source_type === 'pdf' && r.page) return `p.${r.page}`;
  return '';
}

// ── New library ────────────────────────────────────────────────────────
function toggleNewLibrary(open) {
  document.getElementById('newLibraryForm').classList.toggle('open', open);
  document.getElementById('newLibraryBtn').style.display = open ? 'none' : '';
  if (open) document.getElementById('newLibraryName').focus();
}

function submitNewLibrary() {
  const name = document.getElementById('newLibraryName').value.trim();
  if (!name) return;

  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
  const sel = document.getElementById('librarySelect');

  if (!Array.from(sel.options).some(o => o.value === slug)) {
    const opt = document.createElement('option');
    opt.value = slug;
    opt.textContent = name;
    sel.appendChild(opt);
  }
  sel.value = slug;
  document.getElementById('newLibraryName').value = '';
  toggleNewLibrary(false);
  onLibraryChange();
}

// ── Helpers ────────────────────────────────────────────────────────────
function currentLibrary() { return document.getElementById('librarySelect').value; }

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const body = await res.text();
    let msg;
    try { msg = JSON.parse(body).detail || body; } catch { msg = body; }
    throw new Error(msg);
  }
  return res.json();
}

// Kick off
init();
</script>
</body>
</html>
