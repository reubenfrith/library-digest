<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Digest</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #212436;
    --border: #2a2d3a;
    --accent: #6c8ef5;
    --accent-dim: #3d4f8a;
    --text: #e2e4ed;
    --text-dim: #7a7f9a;
    --danger: #e05c6a;
    --success: #4caf7d;
    --warning: #e0a84e;
    --radius: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ───────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; }
  .breadcrumb { color: var(--text-dim); font-size: 13px; }
  .breadcrumb .sep { margin: 0 6px; }
  .breadcrumb .topic-crumb { color: var(--text); font-weight: 500; }
  .header-center { flex: 1; max-width: 480px; }
  .search-wrap { position: relative; }
  .search-wrap input { width: 100%; padding: 7px 12px 7px 32px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; outline: none; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon-hdr { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; pointer-events: none; }
  .header-right { display: flex; gap: 8px; margin-left: auto; }

  /* ── Buttons ──────────────────────────────────── */
  button { border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500; padding: 7px 14px; transition: opacity 0.15s; white-space: nowrap; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 6px 12px; }
  .btn-danger-sm { background: transparent; border: none; color: var(--danger); padding: 3px 7px; font-size: 12px; }

  /* ── Forms / inputs ───────────────────────────── */
  input[type="text"], textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; }

  .form-row { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
  .form-row input { flex: 1; }

  /* ── Tags chip input ──────────────────────────── */
  .tag-input-box {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
    padding: 5px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: text;
    min-height: 36px;
    position: relative;
  }
  .tag-input-box:focus-within { border-color: var(--accent); }
  .tag-input-box input {
    border: none;
    padding: 2px 4px;
    background: transparent;
    flex: 1;
    min-width: 80px;
    width: auto;
  }
  .tag-input-box input:focus { border-color: transparent; }
  .tag-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-dim); color: var(--text); border-radius: 4px; padding: 2px 8px; font-size: 12px; }
  .tag-chip button { background: none; border: none; color: var(--text-dim); padding: 0 0 0 2px; font-size: 11px; cursor: pointer; line-height: 1; }
  .tag-suggestions {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 100;
    max-height: 150px;
    overflow-y: auto;
  }
  .tag-suggestion { padding: 7px 12px; cursor: pointer; font-size: 13px; }
  .tag-suggestion:hover { background: var(--border); }

  /* ── Source cards ─────────────────────────────── */
  .source-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 13px;
    margin-bottom: 8px;
  }
  .source-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .source-info { flex: 1; min-width: 0; }
  .source-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .source-title { font-weight: 500; font-size: 13px; }
  .status-badge { font-size: 11px; border-radius: 4px; padding: 1px 6px; }
  .status-done    { background: #1a3a2a; color: var(--success); }
  .status-pending { background: #2a2010; color: var(--warning); }
  .status-error   { background: #2a1015; color: var(--danger); }
  .source-meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; word-break: break-all; }
  .tag-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tag-pill { background: var(--accent-dim); color: var(--text); border-radius: 4px; padding: 1px 7px; font-size: 11px; }

  /* ── Note cards ───────────────────────────────── */
  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 13px;
    margin-bottom: 8px;
  }
  .note-card.editing { border-color: var(--accent); }
  .note-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .note-body { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; cursor: pointer; }
  .note-body:hover { color: var(--accent); }
  .note-edit-area { width: 100%; min-height: 80px; }
  .note-actions { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }

  /* ── Add-source form ──────────────────────────── */
  .add-form { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .add-status { font-size: 12px; min-height: 16px; }
  .add-status.error { color: var(--danger); }
  .add-status.ok { color: var(--success); }

  /* ── Topic cards ──────────────────────────────── */
  .topic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    transition: border-color 0.15s;
  }
  .topic-card:hover { border-color: var(--accent); }
  .topic-card-info { flex: 1; min-width: 0; }
  .topic-card-name { font-weight: 600; font-size: 15px; }
  .topic-card-desc { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .topic-card-stats { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  /* ── Views ────────────────────────────────────── */
  #app { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .view { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* Topics list */
  #view-topics { padding: 24px; overflow-y: auto; }
  .view-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .view-toolbar h2 { font-size: 18px; font-weight: 600; }
  .new-topic-form { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }

  /* Topic detail */
  #view-topic { display: flex; flex-direction: column; }
  .topic-detail-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .topic-layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    flex: 1;
    overflow: hidden;
  }
  .pane { overflow-y: auto; padding: 20px; }
  .pane + .pane { border-left: 1px solid var(--border); }
  .pane-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .pane-title { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-dim); }

  /* ── Tags drawer ──────────────────────────────── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 320px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 201;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 12px;
    overflow-y: auto;
  }
  .drawer-header { display: flex; justify-content: space-between; align-items: center; }
  .drawer-header span { font-weight: 600; font-size: 15px; }
  .tag-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .tag-row-name { flex: 1; font-size: 13px; }
  .tag-row-count { font-size: 12px; color: var(--text-dim); }
  .tag-edit-input { flex: 1; padding: 4px 7px; font-size: 13px; }

  /* ── Search overlay ───────────────────────────── */
  .search-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 300;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 80px;
  }
  .search-results-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 680px;
    max-width: 96vw;
    max-height: 70vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .search-results-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 500; flex-shrink: 0; }
  .search-group { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .search-group-title { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; cursor: pointer; }
  .search-group-title:hover { text-decoration: underline; }
  .search-hit { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .search-hit:last-child { border-bottom: none; }
  .search-hit-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .search-hit-title { font-weight: 500; font-size: 13px; }
  .search-hit-score { font-size: 11px; color: var(--text-dim); }
  .search-hit-text { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  /* ── Misc ─────────────────────────────────────── */
  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; text-align: center; }
  .spinner { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Library Digest</h1>
    <span id="breadcrumb" class="breadcrumb hidden">
      <span class="sep">/</span>
      <span id="topic-crumb" class="topic-crumb"></span>
    </span>
  </div>
  <div class="header-center">
    <div class="search-wrap">
      <span class="search-icon-hdr">🔍</span>
      <input type="text" id="global-search" placeholder="Search all topics…" oninput="onGlobalSearch()" />
    </div>
  </div>
  <div class="header-right">
    <button class="btn-ghost hidden" id="back-btn" onclick="showTopicsList()">← Topics</button>
  </div>
</header>

<div id="app">

  <!-- ── Topics list ─────────────────────────────── -->
  <div id="view-topics" class="view">
    <div class="view-toolbar">
      <h2>Your Topics</h2>
      <button class="btn-primary" onclick="toggleNewTopicForm(true)">+ New Topic</button>
    </div>
    <div id="new-topic-form" class="new-topic-form hidden">
      <input type="text" id="new-topic-name" placeholder="Topic name…" onkeydown="if(event.key==='Enter')submitNewTopic()" />
      <input type="text" id="new-topic-desc" placeholder="Description (optional)" onkeydown="if(event.key==='Enter')submitNewTopic()" />
      <div class="form-actions">
        <button class="btn-primary" onclick="submitNewTopic()">Create</button>
        <button class="btn-ghost" onclick="toggleNewTopicForm(false)">Cancel</button>
      </div>
    </div>
    <div id="topics-list"><div class="empty"><span class="spinner">⏳</span> Loading…</div></div>
  </div>

  <!-- ── Topic detail ────────────────────────────── -->
  <div id="view-topic" class="view hidden">
    <div class="topic-detail-toolbar">
      <span id="topic-source-count" class="breadcrumb"></span>
      <button class="btn-ghost" onclick="openTagsDrawer()">🏷 Tags</button>
    </div>
    <div class="topic-layout">

      <!-- Sources pane -->
      <div class="pane">
        <div class="pane-header">
          <span class="pane-title">Sources</span>
        </div>
        <div id="sources-list"><div class="empty">No sources yet.</div></div>
        <div class="add-form">
          <input type="text" id="add-url" placeholder="URL or absolute file path…" />
          <div style="position:relative">
            <div class="tag-input-box" id="tag-input-box" onclick="document.getElementById('tag-text-input').focus()">
              <div id="tag-chips-container"></div>
              <input type="text" id="tag-text-input" placeholder="Add tags…" autocomplete="off"
                oninput="onTagTextInput()" onkeydown="onTagKeydown(event)" onblur="hideTagSuggestions()" />
            </div>
            <div id="tag-suggestions" class="tag-suggestions hidden"></div>
          </div>
          <div class="form-row">
            <button class="btn-primary" id="add-btn" onclick="submitIngest()">+ Add Source</button>
          </div>
          <div class="add-status" id="add-status"></div>
        </div>
      </div>

      <!-- Notes pane -->
      <div class="pane">
        <div class="pane-header">
          <span class="pane-title">Notes</span>
        </div>
        <div class="add-form" style="margin-top:0; margin-bottom:16px;">
          <textarea id="new-note-body" placeholder="Capture an insight, question, or summary…" rows="3"></textarea>
          <button class="btn-primary" onclick="submitNote()" style="align-self:flex-start">Save Note</button>
        </div>
        <div id="notes-list"><div class="empty">No notes yet.</div></div>
      </div>

    </div>
  </div>

</div>

<!-- Tags drawer -->
<div id="drawer-overlay" class="overlay hidden" onclick="closeTagsDrawer()"></div>
<div id="tags-drawer" class="drawer hidden">
  <div class="drawer-header">
    <span>Tags</span>
    <button class="btn-ghost" onclick="closeTagsDrawer()">✕</button>
  </div>
  <div id="tags-drawer-list"></div>
</div>

<!-- Search overlay -->
<div id="search-overlay" class="search-overlay hidden" onclick="if(event.target===this)closeSearch()">
  <div class="search-results-panel">
    <div class="search-results-header">
      <span id="search-label"></span>
      <button class="btn-ghost" onclick="closeSearch()">✕</button>
    </div>
    <div id="search-results-content"><div class="empty">Searching…</div></div>
  </div>
</div>

<script>
const API = (location.protocol !== 'file:') ? '' : 'http://localhost:8000';

// ── State ──────────────────────────────────────────────────────────────────
const state = {
  topics: [],
  currentTopic: null,   // full topic object
  sources: [],
  notes: [],
  tags: [],
  pendingTags: [],      // tags being added to current ingest form
  searchTimer: null,
};

// ── Boot ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', loadTopics);

// ── API ────────────────────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const body = await res.text();
    let msg;
    try { msg = JSON.parse(body).detail || body; } catch { msg = body; }
    throw new Error(msg);
  }
  return res.json();
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (d < 60) return 'just now';
  if (d < 3600) return `${Math.floor(d/60)}m ago`;
  if (d < 86400) return `${Math.floor(d/3600)}h ago`;
  return new Date(iso).toLocaleDateString();
}

// ── Navigation ─────────────────────────────────────────────────────────────
function showTopicsList() {
  document.getElementById('view-topics').classList.remove('hidden');
  document.getElementById('view-topic').classList.add('hidden');
  document.getElementById('back-btn').classList.add('hidden');
  document.getElementById('breadcrumb').classList.add('hidden');
  state.currentTopic = null;
  loadTopics();
}

async function showTopicView(slug) {
  document.getElementById('view-topics').classList.add('hidden');
  document.getElementById('view-topic').classList.remove('hidden');
  document.getElementById('back-btn').classList.remove('hidden');
  document.getElementById('breadcrumb').classList.remove('hidden');
  await loadTopic(slug);
}

// ── Topics list ────────────────────────────────────────────────────────────
async function loadTopics() {
  try {
    state.topics = await apiFetch('/topics');
    renderTopics();
  } catch (e) {
    document.getElementById('topics-list').innerHTML =
      `<div class="empty">Could not load topics: ${esc(e.message)}</div>`;
  }
}

function renderTopics() {
  const el = document.getElementById('topics-list');
  if (!state.topics.length) {
    el.innerHTML = '<div class="empty">No topics yet. Create one to get started.</div>';
    return;
  }
  el.innerHTML = state.topics.map(t => `
    <div class="topic-card" onclick="showTopicView('${esc(t.slug)}')">
      <div class="topic-card-info">
        <div class="topic-card-name">${esc(t.name)}</div>
        ${t.description ? `<div class="topic-card-desc">${esc(t.description)}</div>` : ''}
        <div class="topic-card-stats">${t.source_count} sources · ${t.total_chunks.toLocaleString()} chunks</div>
      </div>
      <button class="btn-danger-sm" onclick="event.stopPropagation(); confirmDeleteTopic('${esc(t.slug)}', '${esc(t.name)}')">Delete</button>
    </div>
  `).join('');
}

function toggleNewTopicForm(open) {
  document.getElementById('new-topic-form').classList.toggle('hidden', !open);
  if (open) document.getElementById('new-topic-name').focus();
}

async function submitNewTopic() {
  const name = document.getElementById('new-topic-name').value.trim();
  if (!name) return;
  const desc = document.getElementById('new-topic-desc').value.trim();
  try {
    await apiFetch('/topics', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description: desc }),
    });
    document.getElementById('new-topic-name').value = '';
    document.getElementById('new-topic-desc').value = '';
    toggleNewTopicForm(false);
    loadTopics();
  } catch (e) {
    alert(e.message);
  }
}

async function confirmDeleteTopic(slug, name) {
  if (!confirm(`Delete topic "${name}" and all its sources, notes, and embeddings?\nThis cannot be undone.`)) return;
  await apiFetch(`/topics/${slug}`, { method: 'DELETE' });
  loadTopics();
}

// ── Topic view ─────────────────────────────────────────────────────────────
async function loadTopic(slug) {
  const data = await apiFetch(`/topics/${slug}/digest`);
  state.currentTopic = data.topic;
  state.sources = data.sources;
  state.notes = data.notes;
  state.tags = data.tags;
  state.pendingTags = [];

  document.getElementById('topic-crumb').textContent = data.topic.name;
  document.getElementById('topic-source-count').textContent =
    `${data.sources.length} source${data.sources.length !== 1 ? 's' : ''} · ${data.notes.length} note${data.notes.length !== 1 ? 's' : ''}`;

  renderSources();
  renderNotes();
  renderTagChips();
}

// ── Sources ────────────────────────────────────────────────────────────────
function renderSources() {
  const el = document.getElementById('sources-list');
  if (!state.sources.length) {
    el.innerHTML = '<div class="empty">No sources yet. Add one below.</div>';
    return;
  }
  const icons = { pdf:'📄', epub:'📄', web:'🌐', video:'🎬', text:'📝' };
  el.innerHTML = state.sources.map(s => {
    const icon = icons[s.source_type] || '📎';
    const statusLabel = { done: '✓ done', pending: '⏳ indexing', error: '✗ error' }[s.ingest_status] || s.ingest_status;
    const statusClass = `status-${s.ingest_status}`;
    const tags = (s.tags || []).map(t => `<span class="tag-pill">${esc(t)}</span>`).join('');
    return `
      <div class="source-card">
        <div class="source-card-top">
          <div class="source-info">
            <div class="source-title-row">
              <span>${icon}</span>
              <span class="source-title">${esc(s.source_title || s.source_ref)}</span>
              <span class="status-badge ${statusClass}">${statusLabel}</span>
            </div>
            ${s.ingest_status === 'error' ? `<div class="source-meta" style="color:var(--danger)">${esc(s.error_message)}</div>` : ''}
            <div class="source-meta">${s.chunk_count.toLocaleString()} chunks · ${esc(s.source_ref)}</div>
            ${tags ? `<div class="tag-pills">${tags}</div>` : ''}
          </div>
          <button class="btn-danger-sm" onclick="deleteSource('${esc(s.source_ref)}')">delete</button>
        </div>
      </div>`;
  }).join('');
}

async function deleteSource(sourceRef) {
  if (!confirm(`Delete "${sourceRef}"?\nThis removes all its chunks from the index.`)) return;
  await apiFetch(`/topics/${state.currentTopic.slug}/sources`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source_ref: sourceRef }),
  });
  await refreshTopicData();
}

async function submitIngest() {
  const url = document.getElementById('add-url').value.trim();
  if (!url) { setStatus('Enter a URL or file path.', 'error'); return; }

  const btn = document.getElementById('add-btn');
  const tags = [...state.pendingTags];
  btn.disabled = true;
  btn.textContent = '⏳ Indexing…';
  setStatus('', '');

  try {
    const src = await apiFetch(`/topics/${state.currentTopic.slug}/ingest`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path_or_url: url, tags }),
    });
    setStatus(`✓ "${src.source_title}" — ${src.chunk_count} chunks added.`, 'ok');
    document.getElementById('add-url').value = '';
    state.pendingTags = [];
    renderTagChips();
    await refreshTopicData();
  } catch (e) {
    setStatus(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '+ Add Source';
  }
}

function setStatus(msg, type) {
  const el = document.getElementById('add-status');
  el.textContent = msg;
  el.className = 'add-status' + (type ? ` ${type}` : '');
}

// ── Tag chip input ─────────────────────────────────────────────────────────
function renderTagChips() {
  const container = document.getElementById('tag-chips-container');
  container.innerHTML = state.pendingTags.map(t => `
    <span class="tag-chip">${esc(t)}<button onclick="removeTag('${esc(t)}')">✕</button></span>
  `).join('');
}

function addTag(name) {
  name = name.trim().toLowerCase().replace(/\s+/g, '-');
  if (!name || state.pendingTags.includes(name)) return;
  state.pendingTags.push(name);
  renderTagChips();
  document.getElementById('tag-text-input').value = '';
  hideTagSuggestions();
}

function removeTag(name) {
  state.pendingTags = state.pendingTags.filter(t => t !== name);
  renderTagChips();
}

function onTagTextInput() {
  const val = document.getElementById('tag-text-input').value;
  if (val.endsWith(',')) { addTag(val.slice(0, -1)); return; }
  const suggestions = state.tags
    .map(t => t.name)
    .filter(n => n.includes(val.toLowerCase()) && !state.pendingTags.includes(n));
  const el = document.getElementById('tag-suggestions');
  if (val && suggestions.length) {
    el.innerHTML = suggestions.map(n =>
      `<div class="tag-suggestion" onmousedown="addTag('${esc(n)}')">${esc(n)}</div>`
    ).join('');
    el.classList.remove('hidden');
  } else {
    hideTagSuggestions();
  }
}

function onTagKeydown(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    addTag(document.getElementById('tag-text-input').value);
  } else if (e.key === 'Backspace' && !document.getElementById('tag-text-input').value) {
    state.pendingTags.pop();
    renderTagChips();
  } else if (e.key === 'Escape') {
    hideTagSuggestions();
  }
}

function hideTagSuggestions() {
  setTimeout(() => document.getElementById('tag-suggestions').classList.add('hidden'), 150);
}

// ── Notes ──────────────────────────────────────────────────────────────────
function renderNotes() {
  const el = document.getElementById('notes-list');
  if (!state.notes.length) {
    el.innerHTML = '<div class="empty">No notes yet.</div>';
    return;
  }
  el.innerHTML = state.notes.map(n => {
    const srcName = n.source_id
      ? (state.sources.find(s => s.id === n.source_id)?.source_title || '')
      : '';
    return `
      <div class="note-card" id="note-${n.id}">
        <div class="note-meta">${timeAgo(n.created_at)}${srcName ? ` · ${esc(srcName)}` : ''}</div>
        <div class="note-body" onclick="expandNote(${n.id})">${esc(n.body)}</div>
      </div>`;
  }).join('');
}

async function submitNote() {
  const body = document.getElementById('new-note-body').value.trim();
  if (!body) return;
  await apiFetch(`/topics/${state.currentTopic.slug}/notes`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ body }),
  });
  document.getElementById('new-note-body').value = '';
  await refreshTopicData();
}

function expandNote(noteId) {
  const card = document.getElementById(`note-${noteId}`);
  const note = state.notes.find(n => n.id === noteId);
  if (!note) return;
  card.classList.add('editing');
  card.innerHTML = `
    <textarea class="note-edit-area" id="note-edit-${noteId}">${esc(note.body)}</textarea>
    <div class="note-actions">
      <button class="btn-danger-sm" onclick="deleteNote(${noteId})">Delete</button>
      <button class="btn-ghost" onclick="cancelNoteEdit(${noteId})">Cancel</button>
      <button class="btn-primary" onclick="saveNote(${noteId})">Save</button>
    </div>`;
  document.getElementById(`note-edit-${noteId}`).focus();
}

function cancelNoteEdit(noteId) {
  renderNotes();
}

async function saveNote(noteId) {
  const body = document.getElementById(`note-edit-${noteId}`).value.trim();
  if (!body) return;
  await apiFetch(`/topics/${state.currentTopic.slug}/notes/${noteId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ body }),
  });
  await refreshTopicData();
}

async function deleteNote(noteId) {
  if (!confirm('Delete this note?')) return;
  await apiFetch(`/topics/${state.currentTopic.slug}/notes/${noteId}`, { method: 'DELETE' });
  await refreshTopicData();
}

async function refreshTopicData() {
  const data = await apiFetch(`/topics/${state.currentTopic.slug}/digest`);
  state.sources = data.sources;
  state.notes = data.notes;
  state.tags = data.tags;
  document.getElementById('topic-source-count').textContent =
    `${data.sources.length} source${data.sources.length !== 1 ? 's' : ''} · ${data.notes.length} note${data.notes.length !== 1 ? 's' : ''}`;
  renderSources();
  renderNotes();
}

// ── Tags drawer ────────────────────────────────────────────────────────────
async function openTagsDrawer() {
  document.getElementById('drawer-overlay').classList.remove('hidden');
  document.getElementById('tags-drawer').classList.remove('hidden');
  renderTagsDrawer();
}

function closeTagsDrawer() {
  document.getElementById('drawer-overlay').classList.add('hidden');
  document.getElementById('tags-drawer').classList.add('hidden');
}

function renderTagsDrawer() {
  const el = document.getElementById('tags-drawer-list');
  if (!state.tags.length) {
    el.innerHTML = '<div class="empty">No tags yet.</div>';
    return;
  }
  el.innerHTML = state.tags.map(t => `
    <div class="tag-row" id="tag-row-${esc(t.name)}">
      <span class="tag-row-name">${esc(t.name)}</span>
      <span class="tag-row-count">${t.source_count}</span>
      <button class="btn-ghost" style="padding:4px 8px;font-size:12px" onclick="startRenameTag('${esc(t.name)}')">Rename</button>
      <button class="btn-danger-sm" onclick="deleteTagFromDrawer('${esc(t.name)}')">Delete</button>
    </div>`).join('');
}

function startRenameTag(name) {
  const row = document.getElementById(`tag-row-${name}`);
  row.innerHTML = `
    <input class="tag-edit-input" id="tag-rename-input" value="${esc(name)}"
      onkeydown="if(event.key==='Enter')commitRename('${esc(name)}'); if(event.key==='Escape')renderTagsDrawer();" />
    <button class="btn-primary" style="padding:4px 10px;font-size:12px" onclick="commitRename('${esc(name)}')">Save</button>
    <button class="btn-ghost" style="padding:4px 8px;font-size:12px" onclick="renderTagsDrawer()">Cancel</button>`;
  document.getElementById('tag-rename-input').focus();
}

async function commitRename(oldName) {
  const newName = document.getElementById('tag-rename-input').value.trim();
  if (!newName || newName === oldName) { renderTagsDrawer(); return; }
  await apiFetch(`/topics/${state.currentTopic.slug}/tags/rename`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ old_name: oldName, new_name: newName }),
  });
  await refreshTopicData();
  renderTagsDrawer();
}

async function deleteTagFromDrawer(name) {
  const tag = state.tags.find(t => t.name === name);
  if (tag?.source_count > 0) {
    if (!confirm(`Tag "${name}" is used by ${tag.source_count} source(s). Delete it anyway?`)) return;
  }
  await apiFetch(`/topics/${state.currentTopic.slug}/tags`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  await refreshTopicData();
  renderTagsDrawer();
}

// ── Global search ──────────────────────────────────────────────────────────
function onGlobalSearch() {
  clearTimeout(state.searchTimer);
  const q = document.getElementById('global-search').value.trim();
  if (!q) { closeSearch(); return; }
  state.searchTimer = setTimeout(() => runGlobalSearch(q), 350);
}

async function runGlobalSearch(query) {
  document.getElementById('search-overlay').classList.remove('hidden');
  document.getElementById('search-label').textContent = `"${query}"`;
  document.getElementById('search-results-content').innerHTML =
    '<div class="empty"><span class="spinner">⏳</span> Searching…</div>';

  try {
    const data = await apiFetch('/search-all', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k_per_topic: 3 }),
    });
    renderSearchResults(data.groups, query);
  } catch (e) {
    document.getElementById('search-results-content').innerHTML =
      `<div class="empty">Error: ${esc(e.message)}</div>`;
  }
}

function renderSearchResults(groups, query) {
  const el = document.getElementById('search-results-content');
  if (!groups.length) {
    el.innerHTML = '<div class="empty">No results found.</div>';
    return;
  }
  el.innerHTML = groups.map(g => `
    <div class="search-group">
      <div class="search-group-title" onclick="closeSearch(); showTopicView('${esc(g.topic.slug)}')">${esc(g.topic.name)} →</div>
      ${g.results.map(r => `
        <div class="search-hit">
          <div class="search-hit-header">
            <span class="search-hit-title">${r.kind === 'note' ? '📝 Note' : esc(r.source_title || r.source_ref)}</span>
            <span class="search-hit-score">${(r.score * 100).toFixed(0)}%</span>
          </div>
          <div class="search-hit-text">${esc(r.text.slice(0, 180))}${r.text.length > 180 ? '…' : ''}</div>
        </div>`).join('')}
    </div>`).join('');
}

function closeSearch() {
  document.getElementById('search-overlay').classList.add('hidden');
  document.getElementById('global-search').value = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSearch(); closeTagsDrawer(); }
});
</script>
</body>
</html>
